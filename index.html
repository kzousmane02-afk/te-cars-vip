<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A2F5A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TE Cars VIP">
<meta name="description" content="Gestion de flotte et de chauffeurs : documents, entretiens, carburant, affectations, rapports.">
<title>TE Cars VIP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* TE Cars VIP v2 : carnet de bord de flotte. Les plaques identifient les véhicules, la couleur ne sert qu'à l'état. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E6EBF2; --field:#F5F7FA;
  --ink:#121B27; --muted:#546275; --line:#D5DCE6;
  --accent:#1A2F5A; --on-accent:#FFFFFF; --gold:#B58A2B; --bar:#B9C6E2;
  --ok:#146C43; --ok-bg:#DCF1E5;
  --warn:#7D5200; --warn-bg:#FAEAC0;
  --bad:#B3261E; --bad-bg:#FBE0DD;
  --info:#1A2F5A; --info-bg:#DCE6FA;
  --shadow:0 1px 2px rgba(18,27,39,.06),0 4px 14px rgba(18,27,39,.05);
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --surface:#161F29; --surface-2:#1F2B38; --field:#0F1720;
    --ink:#E8EDF2; --muted:#94A3B4; --line:#2A3746;
    --accent:#9DB8FF; --on-accent:#0D131A; --gold:#E0B85A; --bar:#2C3C58;
    --ok:#62D69F; --ok-bg:#12352B; --warn:#F2C14E; --warn-bg:#3A2E0F; --bad:#FF8F85; --bad-bg:#3F1B19; --info:#B3C8FF; --info-bg:#1D2C4B;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#161F29; --surface-2:#1F2B38; --field:#0F1720;
  --ink:#E8EDF2; --muted:#94A3B4; --line:#2A3746;
  --accent:#9DB8FF; --on-accent:#0D131A; --gold:#E0B85A; --bar:#2C3C58;
  --ok:#62D69F; --ok-bg:#12352B; --warn:#F2C14E; --warn-bg:#3A2E0F; --bad:#FF8F85; --bad-bg:#3F1B19; --info:#B3C8FF; --info-bg:#1D2C4B;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 104px max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15}h2{font-size:18px}h3{font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.small{font-size:13px}.muted{color:var(--muted)}.strong{font-weight:700}.big{font-size:17px;font-weight:600}.center{text-align:center}.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.bt{min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 17px var(--f-display);letter-spacing:.03em;position:relative;box-shadow:var(--shadow)}
.logo::after{content:"";position:absolute;left:11px;right:11px;bottom:7px;height:2px;border-radius:2px;background:var(--gold)}
.logo.big{width:64px;height:64px;font-size:26px;border-radius:16px}.logo.big::after{left:16px;right:16px;bottom:11px;height:3px}
.bname{font:700 18px/1.15 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font-weight:600}.sv.ok{color:var(--ok)}.sv.wait{color:var(--warn)}.sv.bad{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:0 13px;min-height:38px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(18,27,39,.06)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;text-align:center;padding:0 2px}
.nav a[aria-current="page"]{color:var(--accent);background:var(--surface-2)}
.nav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none}

main{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:6px 8px;max-width:960px;margin:0 auto}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.banner.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.banner.col{flex-direction:column;align-items:stretch}
.banner b{color:var(--ink)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.icon{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted)}

/* statistiques */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:0;border-radius:14px;padding:13px 15px;text-align:left;cursor:pointer;display:grid;gap:3px;box-shadow:var(--shadow)}
.stat b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:600}
.stat.expired{background:var(--bad-bg);color:var(--bad)}.stat.soon{background:var(--warn-bg);color:var(--warn)}.stat.ok{background:var(--ok-bg);color:var(--ok)}.stat.maint{background:var(--info-bg);color:var(--info)}

.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chipbar.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chipbar.scroll::-webkit-scrollbar{display:none}
.fchip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;flex:none}
.fchip b{font:700 11px var(--f-mono);background:var(--surface-2);border-radius:99px;padding:1px 7px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.fchip[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:inherit}
.sect{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* plaques, pastilles */
.plate{display:inline-block;font:600 14px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--line);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.expired{background:var(--bad-bg);color:var(--bad)}.pill.soon{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.unset,.pill.neutral{background:var(--surface-2);color:var(--muted)}.pill.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.expired{background:var(--bad)}.dot.soon{background:var(--warn)}.dot.ok{background:var(--ok)}

/* cartes */
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;position:relative}
.card[class*="st-"]::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--stc,var(--line))}
.card.st-expired{--stc:var(--bad)}.card.st-soon{--stc:var(--warn)}.card.st-ok{--stc:var(--ok)}.card.st-unset{--stc:var(--muted)}
.open{all:unset;display:grid;gap:8px;padding:14px 14px 14px 18px;cursor:pointer;min-width:0;box-sizing:border-box}
.open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctitle{font:700 17px/1.25 var(--f-display);overflow-wrap:anywhere}
.cmeta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.who{font-weight:600}
.cactions{padding:0 14px 14px 18px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;display:grid;gap:10px;justify-items:start;background:var(--surface)}
.empty.slim{padding:18px;justify-items:start}
.empty h2{font-size:20px}.empty p{margin:0;color:var(--muted);max-width:52ch}
.empty-ic,.hero-ic{width:52px;height:52px;border-radius:14px;background:var(--info-bg);color:var(--info);display:grid;place-items:center}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 20px;display:grid;gap:12px;justify-items:start;box-shadow:var(--shadow)}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fleet>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;gap:2px;box-shadow:var(--shadow)}
.fleet b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fleet span{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;box-shadow:var(--shadow)}
.panel.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.chart{width:100%;height:auto;display:block}
.chart .cv{font:600 10px var(--f-mono);fill:var(--muted)}.chart .cl{font:600 11px var(--f-body);fill:var(--muted);text-transform:capitalize}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.qbtn{display:grid;justify-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--accent);box-shadow:var(--shadow)}
.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{all:unset;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-top:1px solid var(--line);box-sizing:border-box;width:100%}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.rmain{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.rside{display:grid;justify-items:end;gap:2px;text-align:right;flex:none}
.searchw{position:relative;color:var(--muted)}
.searchw .ic{position:absolute;left:13px;top:13px;pointer-events:none}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px 0 40px;font-size:16px}
.vfsel,.fld select,.fld input,.fld textarea,.docadd select,.docrow input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--field);padding:8px 12px;font-size:16px;min-width:0}
.vfsel{background:var(--surface)}

/* menu Plus */
.menu{display:grid;gap:8px}
.mi{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:64px}
.mi>.ic:last-child{color:var(--muted);margin-left:auto}
.mic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--info-bg);color:var(--info);display:grid;place-items:center}
.mt{display:grid;gap:1px;min-width:0}.mt b{font:700 16px/1.2 var(--f-display)}.mt small{color:var(--muted);font-size:13px}
.count{min-width:26px;height:26px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--bad-bg);color:var(--bad);font:700 12px var(--f-mono);margin-left:auto}
.count+.ic{margin-left:0!important}
.msg{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--field);border-radius:11px;padding:10px 12px;font:13px/1.5 var(--f-body)}
.facts{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:5px 14px;margin:0;font-size:14px;background:var(--field);border-radius:11px;padding:10px 12px}
.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:break-word;min-width:0}

/* rapport */
.rhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.rt{margin:18px 0 8px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--field)}
tfoot td{font-weight:700;background:var(--field)}
.r{text-align:right;white-space:nowrap}

/* fenêtre de saisie */
dialog{border:0;padding:0;width:min(580px,100%);max-width:100%;max-height:94dvh;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(8,12,18,.55)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 4px max(18px,env(safe-area-inset-left,0px))}
.dh h2{font-size:20px;outline:none}
.db{display:grid;gap:14px;padding:8px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px))}
.fld{display:grid;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld textarea{min-height:76px;resize:vertical}
.fld input[name="plate"]{font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-top:-8px;min-height:0}.hint:empty{display:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1 1 90px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--field);font-weight:600;color:var(--ink);cursor:pointer;padding:0 8px;text-align:center}
.radios.sm label{font-size:14px;min-height:40px}
.radios input{width:auto;min-height:0;accent-color:var(--accent)}
.radios label:has(input:checked){border-color:var(--accent);background:var(--info-bg);color:var(--info)}
.docs{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.docrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--field);border-radius:12px;padding:10px}
.docname{flex:1 1 100%;font-weight:600;font-size:14px}
.docname-in{flex:1 1 100%;background:var(--surface)!important}
.docrow input{flex:1 1 0;background:var(--surface)}
.docrow .refin{flex:1 1 100%;min-height:40px;font-size:15px}
.docadd{display:flex;gap:8px;flex-wrap:wrap}
.docadd select{flex:1 1 180px;width:auto}
.form-err{margin:0 max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));padding:10px 12px;border-radius:11px;background:var(--bad-bg);color:var(--bad);font-size:14px;font-weight:600}
.df{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.df .grow{flex:1}

/* verrou */
.lock{min-height:100dvh;display:grid;place-items:center;padding:20px}
.lockbox{width:min(360px,100%);display:grid;gap:16px;justify-items:center;text-align:center}
.lockbox form{display:grid;gap:12px;width:100%;text-align:left}
.lockbox .form-err{margin:0}
.lockbox input{text-align:center;letter-spacing:.4em;font-size:22px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1}
#toast.act.show{pointer-events:auto}
#toast button{border:0;background:none;color:var(--gold);font-weight:700;cursor:pointer;padding:4px 0;font-size:14px;filter:brightness(1.4)}
dialog[open] ~ #toast{bottom:24px}

/* grand écran */
@media (min-width:700px){dialog{margin:auto;border-radius:20px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:860px){
  body{padding-bottom:48px}
  .nav{position:static;display:flex;gap:4px;border:0;background:none;padding:0 0 10px;box-shadow:none;max-width:960px;margin:0 auto}

  .top{max-width:960px;margin:0 auto}
  #toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){#toast,.btn{transition:none}}

/* impression (rapport PDF) */
@media print{
  body{background:#fff;color:#000;padding:0}body::before{display:none}
  .top,.nav,.noprint,.back,#toast,.banner{display:none!important}
  main{max-width:none;display:block}
  .vh{display:none}
  #report{display:block}
  .panel,.fleet>div,.tw{box-shadow:none}
  :root{--bg:#fff;--surface:#fff;--ink:#000;--line:#bbb}
  tr{break-inside:avoid}
}

/* ===================== STOCKAGE (IndexedDB + copie localStorage) ===================== */
let db=null;
function idbOpen(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('no idb'));
  const r=indexedDB.open('tecars-vip',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
});}
const idbReq=(store,mode,fn)=>new Promise((res,rej)=>{const tx=db.transaction(store,mode),st=tx.objectStore(store),rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});
const idbGet=(s,k)=>idbReq(s,'readonly',st=>st.get(k));
const idbPut=(s,k,v)=>idbReq(s,'readwrite',st=>st.put(v,k));
const idbDel=(s,k)=>idbReq(s,'readwrite',st=>st.delete(k));
const idbAll=(s)=>idbReq(s,'readonly',st=>st.getAll());

function cleanData(src){
  const out={};
  for(const c of COLS)out[c]=Array.isArray(src&&src[c])?src[c].filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&x.id):[];
  for(const o of [...out.vehicles,...out.drivers])if(!Array.isArray(o.docs))o.docs=[];
  for(const o of [...out.vehicles,...out.drivers])o.docs=o.docs.filter(d=>d&&typeof d==='object').map(d=>({...d,id:d.id||uid('d')}));
  return out;
}
function cleanSettings(s){
  const o={...DEFSET,...(s&&typeof s==='object'?s:{})};
  o.alertDays=[15,30,45,60].includes(+o.alertDays)?+o.alertDays:30;
  o.backupDays=[0,3,7,14,30].includes(+o.backupDays)?+o.backupDays:7;
  o.theme=['auto','light','dark'].includes(o.theme)?o.theme:'auto';
  o.cc=String(o.cc||'').replace(/\D/g,'');
  for(const k of ['company','currency','pin','lastExport','lastAuto'])o[k]=String(o[k]??'');
  return o;
}
function applyPayload(p){
  const src=p&&p.data&&typeof p.data==='object'?p.data:p;
  S.data=cleanData(src);
  S.settings=cleanSettings(p&&p.settings);
}
const makePayload=()=>({app:'tecars-vip',version:2,savedAt:new Date().toISOString(),data:S.data,settings:S.settings});
const hasData=()=>COLS.some(c=>S.data[c].length>0);
const counts=()=>Object.fromEntries(COLS.map(c=>[c,S.data[c].length]));

async function loadState(){
  let raw=null,lsRaw=null;
  try{const s=localStorage.getItem(LS2)||localStorage.getItem(LS1);if(s)lsRaw=JSON.parse(s);}catch(e){}
  try{db=await idbOpen();raw=await idbGet('kv','state');S.storage='idb';}catch(e){db=null;S.storage='ls';}
  /* on garde la version la plus récente entre la base et la copie de secours */
  if(raw&&lsRaw&&lsRaw.savedAt&&raw.savedAt&&lsRaw.savedAt>raw.savedAt)raw=lsRaw;
  if(!raw)raw=lsRaw;
  if(raw)applyPayload(raw);
}
let saveT=0;
function setStatus(){
  const el=document.getElementById('sv');if(!el)return;
  let k='sv.ok',c='ok';
  if(S.saveErr){k='sv.err';c='bad';}else if(saveT){k='sv.saving';c='wait';}
  el.className='sv '+c;el.textContent=t(k);
}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,200);setStatus();}
async function flush(){
  clearTimeout(saveT);saveT=0;
  const p=makePayload();let ok=false;
  try{localStorage.setItem(LS2,JSON.stringify(p));ok=true;}catch(e){}
  if(db){try{await idbPut('kv','state',p);ok=true;}catch(e){}}
  S.saveErr=!ok;S.saved=ok?Date.now():0;setStatus();
}
async function askPersist(){
  try{if(navigator.storage&&navigator.storage.persisted){S.persisted=await navigator.storage.persisted();if(!S.persisted&&navigator.storage.persist)S.persisted=await navigator.storage.persist();}}catch(e){}
}
/* copies de sécurité */
async function snapshot(kind){
  if(!db)return;
  try{
    const at=new Date().toISOString(),key=kind+'|'+at;
    await idbPut('snaps',key,{key,kind,at,counts:counts(),json:JSON.stringify(makePayload())});
    await pruneSnaps();S.snaps=null;
  }catch(e){}
}
async function listSnaps(){if(!db)return [];try{return (await idbAll('snaps')).sort((a,b)=>b.at.localeCompare(a.at));}catch(e){return [];}}
async function pruneSnaps(){
  const all=await listSnaps(),keep={auto:14,pre:8},seen={auto:0,pre:0};
  for(const s of all){const k=s.kind==='auto'?'auto':'pre';if(++seen[k]>keep[k])await idbDel('snaps',s.key);}
}
async function autoSnapshot(){
  if(!db||!hasData())return;
  const day=iso(today());if(S.settings.lastAuto===day)return;
  await snapshot('auto');S.settings.lastAuto=day;save();
}

function put(col,obj,quiet){
  obj.updatedAt=Date.now();
  const a=S.data[col],i=a.findIndex(x=>x.id===obj.id);
  if(i>=0)a[i]=obj;else a.push(obj);
  save();if(!quiet)render();
}
function linkedOf(col,id){
  const rm=[],ch=[];
  if(col==='vehicles'){for(const c of ['assignments','movements','maintenance','fuel','incidents'])for(const r of S.data[c])if(r.vehicleId===id)rm.push({col:c,obj:r});}
  if(col==='drivers'){
    for(const r of S.data.assignments)if(r.driverId===id)rm.push({col:'assignments',obj:r});
    for(const c of ['fuel','incidents'])for(const r of S.data[c])if(r.driverId===id)ch.push({col:c,obj:r});
  }
  return {rm,ch};
}
function removeRecord(col,id){
  const rec=byId(col,id);if(!rec)return null;
  const {rm,ch}=linkedOf(col,id);
  const undo={removed:[{col,obj:clone(rec)},...rm.map(x=>({col:x.col,obj:clone(x.obj)}))],changed:ch.map(x=>({col:x.col,obj:clone(x.obj)}))};
  for(const x of undo.removed)S.data[x.col]=S.data[x.col].filter(r=>r.id!==x.obj.id);
  for(const x of ch)x.obj.driverId='';
  save();return undo;
}
function undoRemove(u){
  if(!u)return;
  for(const x of u.removed)if(!byId(x.col,x.obj.id))S.data[x.col].push(x.obj);
  for(const x of u.changed){const i=S.data[x.col].findIndex(r=>r.id===x.obj.id);if(i>=0)S.data[x.col][i]=x.obj;}
  save();render();
}

/* ===================== CALCULS ===================== */
function kmOf(v){let k=num(v.km);for(const c of ['maintenance','fuel','movements'])for(const r of S.data[c])if(r.vehicleId===v.id)k=Math.max(k,num(r.km));return k;}
function allDocs(){
  const out=[];
  for(const v of S.data.vehicles)for(const d of v.docs||[])out.push({col:'vehicles',owner:v,doc:d});
  for(const r of S.data.drivers)for(const d of r.docs||[])out.push({col:'drivers',owner:r,doc:d});
  return out;
}
const mtLabel=m=>T['mty.'+m.type]?t('mty.'+m.type):(m.type||'');
function maintAlerts(){
  const out=[];
  for(const v of S.data.vehicles){
    const latest={};
    for(const m of S.data.maintenance)if(m.vehicleId===v.id){const k=m.type||'autre';if(!latest[k]||(m.date||'')>(latest[k].date||''))latest[k]=m;}
    const km=kmOf(v);
    for(const k in latest){
      const m=latest[k];let st='ok',text='',days=null,left=null;
      if(m.nextDate){days=daysLeft(m.nextDate);const s=status(m.nextDate);if(RANK[s]<RANK[st]||st==='ok'){st=s==='unset'?'ok':s;text=t('mt.dueDate',{type:mtLabel(m),plate:v.plate,d:fmt(m.nextDate)});}}
      if(num(m.nextKm)>0){
        left=num(m.nextKm)-km;
        const s=left<0?'expired':left<=500?'soon':'ok';
        if(RANK[s]<RANK[st]||(st==='ok'&&s!=='ok')){st=s;text=left<0?t('mt.overKm',{type:mtLabel(m),plate:v.plate,n:nfmt(-left)}):t('mt.dueKm',{type:mtLabel(m),plate:v.plate,n:nfmt(left)});}
      }
      if(st!=='ok'||(days!==null&&days<=60))out.push({v,m,st,text,days});
    }
  }
  return out;
}
const COSTCOLS=['maintenance','fuel','incidents'];
function inPeriod(date,p){
  if(!date)return false;
  if(p.mode==='all')return true;
  if(p.mode==='year')return date.slice(0,4)===p.year;
  return date.slice(0,7)===p.month;
}
function costsBy(p){
  const per={};let tot={maintenance:0,fuel:0,incidents:0,total:0};
  for(const v of S.data.vehicles)per[v.id]={v,maintenance:0,fuel:0,incidents:0,total:0};
  for(const c of COSTCOLS)for(const r of S.data[c]){
    if(!inPeriod(r.date,p))continue;const x=num(r.cost);if(!per[r.vehicleId])continue;
    per[r.vehicleId][c]+=x;per[r.vehicleId].total+=x;tot[c]+=x;tot.total+=x;
  }
  return {per:Object.values(per),tot};
}
const monthKey=d=>iso(d).slice(0,7);
function lastMonths(n){const out=[],d=today();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(monthKey(x));}return out;}
function monthCost(m){let s=0;for(const c of COSTCOLS)for(const r of S.data[c])if((r.date||'').slice(0,7)===m)s+=num(r.cost);return s;}
function consumption(vid,p){
  const rs=S.data.fuel.filter(f=>f.vehicleId===vid&&inPeriod(f.date,p)&&num(f.km)>0&&num(f.liters)>0).sort((a,b)=>num(a.km)-num(b.km));
  if(rs.length<2)return null;
  const dist=num(rs[rs.length-1].km)-num(rs[0].km);if(dist<=0)return null;
  let l=0;for(let i=1;i<rs.length;i++)l+=num(rs[i].liters);
  return {l100:l/dist*100,km:dist};
}

function costChart(){
  const ms=lastMonths(6),vals=ms.map(monthCost),max=Math.max(...vals,1);
  const W=320,H=140,bw=36,gap=(W-bw*6)/7,top=22,base=H-24;
  const ab=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
  let g='';
  ms.forEach((m,i)=>{
    const x=gap+i*(bw+gap),h=Math.max(vals[i]>0?3:0,(base-top)*vals[i]/max),y=base-h,last=i===5;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="5" fill="${last?'var(--accent)':'var(--bar)'}"/>`;
    if(vals[i]>0)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" class="cv">${esc(ab(vals[i]))}</text>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" class="cl">${esc(fmtMon3(m))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(t('cost.chart'))}"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>${g}</svg>`;
}
function recentItems(){
  const out=[];
  const mk=(col,r,ico,label,extra)=>out.push({col,r,ico,label,extra,date:r.date||'',u:r.updatedAt||0});
  for(const r of S.data.movements)mk('movements',r,r.type==='in'?'in':'out',t('r.'+(r.reason||'other')),t(r.type==='in'?'m.in':'m.out'));
  for(const r of S.data.maintenance)mk('maintenance',r,'maintenance',mtLabel(r),num(r.cost)?money(r.cost):'');
  for(const r of S.data.fuel)mk('fuel',r,'fuel',nfmt(num(r.liters))+' L',num(r.cost)?money(r.cost):'');
  for(const r of S.data.incidents)mk('incidents',r,'incidents',T['ity.'+r.type]?t('ity.'+r.type):r.type,r.status==='closed'?t('in.closed'):t('in.open'));
  return out.sort((a,b)=>b.date.localeCompare(a.date)||b.u-a.u).slice(0,6);
}

  const pred={urgent:i=>i.st==='expired'||i.st==='soon',expired:i=>i.st==='expired','60':i=>i.st==='expired'||i.st==='soon'||(i.days!==null&&i.days<=60),all:i=>i.st!=='unset',unset:i=>i.st==='unset'}[F]||(()=>true);

  h+=sel.length?`<div class="list">${sel.slice(0,60).map(i=>i.html()).join('')}</div>`:`<div class="empty slim"><p>${esc(t('todo.empty'))}</p></div>`;

  h+=`<section class="sect"><div class="sect-h"><h2>${esc(t('cost.chart'))}</h2><span class="mono big">${esc(money(mc))}</span></div><div class="panel">${lastMonths(6).some(m=>monthCost(m)>0)?costChart():`<p class="muted" style="margin:0">${esc(t('cost.none'))}</p>`}</div></section>`;
  const rec=recentItems();
  h+=`<section class="sect"><h2>${esc(t('recent.title'))}</h2>`;
  h+=rec.length?`<div class="rows">${rec.map(x=>`<button type="button" class="row" data-action="open" data-col="${x.col}" data-id="${esc(x.r.id)}"><span class="rico">${ic(x.ico,18)}</span><span class="rmain">${plateChip(x.r.vehicleId)} <span>${esc(x.label)}</span></span><span class="rside"><span class="mono muted">${esc(fmtShort(x.date))}</span><span class="muted small">${esc(x.extra||'')}</span></span></button>`).join('')}</div>`:`<p class="muted" style="margin:0">${esc(t('recent.empty'))}</p>`;
  h+=`</section>`;
  h+=`<section class="sect"><h2>${esc(t('quick.title'))}</h2><div class="quick">

    <button type="button" class="qbtn" data-action="add" data-col="maintenance">${ic('maintenance',22)}<span>${esc(t('quick.maint'))}</span></button>
    <button type="button" class="qbtn" data-action="add" data-col="movements">${ic('movements',22)}<span>${esc(t('quick.move'))}</span></button>
    <button type="button" class="qbtn" data-action="add" data-col="assignments">${ic('assignments',22)}<span>${esc(t('quick.assign'))}</span></button>

Object.assign(T,{'quick.fuel':['Plein','Fill-up'],'quick.maint':['Entretien','Service'],'quick.move':['Mouvement','Movement'],'quick.assign':['Affectation','Assignment'],'quick.inc':['Incident','Incident']});

function backupBanner(){
  const n=+S.settings.backupDays;if(!n||!hasData())return '';
  const last=S.settings.lastExport,age=last?Math.round((today()-parse(last.slice(0,10)))/DAY):null;
  if(age!==null&&age<n)return '';
  return `<div class="banner warn"><span>${esc(t('bkw.text',{d:last?fmt(last.slice(0,10)):t('bkw.never')}))}</span><button type="button" class="btn small" data-action="exportnow">${esc(t('bkw.now'))}</button></div>`;
}
function isStandalone(){return window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function installBanner(){
  if(isStandalone()||S.instHidden)return '';
  if(S.installEvt)return `<div class="banner info"><span>${esc(t('inst.banner'))}</span><span class="btnrow"><button type="button" class="btn small primary" data-action="install">${esc(t('inst.btn'))}</button><button type="button" class="btn small" data-action="hideinst">${ic('x',16)}</button></span></div>`;
  if(isIOS()&&/^https?:$/.test(location.protocol))return `<div class="banner info"><span>${esc(t('inst.ios'))}</span><button type="button" class="btn small" data-action="hideinst">${ic('x',16)}</button></div>`;
  return '';
}

const searchBox=(col,ph)=>`<div class="searchw">${ic('search',18)}<input class="search" type="search" id="q-${col}" value="${esc(S.q[col])}" placeholder="${esc(t(ph))}" aria-label="${esc(t(ph))}" autocomplete="off"></div>`;
function vehicleCard(v){
  const a=activeFor('vehicleId',v.id),st=WORSTST[worst(v)],km=kmOf(v);
  return card('vehicles',v.id,`<div class="ctop">${plateEl(v.plate)}${pill(v.status==='out'?'info':'neutral',t(v.status==='out'?'s.out':'s.in'))}</div>
    <div class="ctitle">${esc(v.model||'—')}${v.year?` <span class="muted">· ${esc(v.year)}</span>`:''}</div>
    <div class="cmeta">${esc(t('v.driver'))} : ${a?esc(nameOf(a.driverId)):esc(t('none'))}${km?` · ${esc(nfmt(km))} km`:''}</div>${docChips(v)}`,'st-'+st);
}
function vehiclesView(){
  const V=S.data.vehicles;
  let h=viewHead(t('nav.vehicles'),V.length?countText(V.length,'v.count1','v.countN'):'','vehicles','v.addFull');
  if(!V.length)return h+emptyBlock(t('v.empty'),t('v.emptyText'),'vehicles','v.addFull');
  const q=norm(S.q.vehicles),bad=new Set(maintAlerts().filter(x=>x.st!=='ok').map(x=>x.v.id));
  const flt={all:()=>true,in:v=>v.status!=='out',out:v=>v.status==='out',bad:v=>worst(v)<=1||bad.has(v.id)}[S.vstat]||(()=>true);
  const L=V.filter(v=>(!q||norm(v.plate).includes(q)||norm(v.model).includes(q))&&flt(v)).sort((a,b)=>worst(a)-worst(b)||a.plate.localeCompare(b.plate));
  h+=searchBox('vehicles','v.search');
  h+=`<div class="chipbar">${[['all','all'],['in','s.in'],['out','s.out'],['bad','v.problem']].map(([k,l])=>`<button type="button" class="fchip" data-action="vstat" data-v="${k}" aria-pressed="${S.vstat===k}">${esc(t(l))}</button>`).join('')}</div>`;
  if(!L.length)return h+`<p class="muted">${esc(t('noResult'))}</p>`;
  return h+`<div class="list">${L.map(vehicleCard).join('')}</div>`;
}
function driversView(){
  const D=S.data.drivers;
  let h=viewHead(t('nav.drivers'),D.length?countText(D.length,'dr.count1','dr.countN'):'','drivers','dr.addFull');
  if(!D.length)return h+emptyBlock(t('dr.empty'),t('dr.emptyText'),'drivers','dr.addFull');
  const q=norm(S.q.drivers);
  const L=D.filter(d=>!q||norm(d.name).includes(q)||norm(d.phone).includes(q)).sort((a,b)=>worst(a)-worst(b)||a.name.localeCompare(b.name));
  h+=searchBox('drivers','dr.search');
  if(!L.length)return h+`<p class="muted">${esc(t('noResult'))}</p>`;
  return h+`<div class="list">${L.map(d=>{
    const a=activeFor('driverId',d.id),st=WORSTST[worst(d)];
    return card('drivers',d.id,`<div class="ctop"><span class="ctitle">${esc(d.name)}</span>${a?plateChip(a.vehicleId):''}</div><div class="cmeta mono">${esc(d.phone||'')}</div>${docChips(d)}`,'st-'+st);}).join('')}</div>`;
}

function assignCard(a){
  const act=isActive(a);
  return `<div class="card ${act?'st-ok':''}">${openBtn('assignments',a.id,`<div class="ctop"><span class="ctitle">${esc(nameOf(a.driverId))}</span>${plateChip(a.vehicleId)}</div>
    <div class="ctop">${act?pill('ok',t('a.active')):'<span></span>'}<span class="cmeta">${esc(a.end?t('a.range',{a:fmt(a.start),b:fmt(a.end)}):t('a.since',{d:fmt(a.start)}))}</span></div>`)}
    ${act?`<div class="cactions"><button type="button" class="btn small" data-action="endtoday" data-id="${esc(a.id)}">${esc(t('a.endToday'))}</button></div>`:''}</div>`;
}
function vfSel(){
  const V=[...S.data.vehicles].sort((a,b)=>a.plate.localeCompare(b.plate));
  return `<select id="vf" class="vfsel" aria-label="${esc(t('act.allV'))}"><option value="">${esc(t('act.allV'))}</option>${V.map(v=>`<option value="${esc(v.id)}" ${S.vf===v.id?'selected':''}>${esc(v.plate)}</option>`).join('')}</select>`;
}
const totalBar=sum=>`<div class="banner"><span>${esc(t('act.total'))}</span><b class="mono">${esc(money(sum))}</b></div>`;
function activityView(){
  const sub=S.sub;
  const meta={assignments:['act.assign','a.addFull','a.empty','a.emptyText'],movements:['act.moves','m.addFull','m.empty','m.emptyText'],maintenance:['act.maint','mt.addFull','mt.empty','mt.emptyText'],fuel:['act.fuel','fu.addFull','fu.empty','fu.emptyText'],incidents:['act.inc','in.addFull','in.empty','in.emptyText']}[sub];
  let h=viewHead(t('nav.activity'),'',sub,meta[1]);
  h+=`<div class="chipbar scroll" role="tablist">${SUBS.map(k=>`<a class="fchip lnk" href="#activity/${k}" role="tab" aria-pressed="${sub===k}" aria-selected="${sub===k}">${ic(k,16)}<span>${esc(t(({assignments:'act.assign',movements:'act.moves',maintenance:'act.maint',fuel:'act.fuel',incidents:'act.inc'})[k]))}</span><b>${S.data[k].length||''}</b></a>`).join('')}</div>`;
  const all=S.data[sub];
  if(!all.length)return h+emptyBlock(t(meta[2]),t(meta[3]),sub,meta[1]);
  if(sub!=='assignments')h+=vfSel();
  if(sub==='assignments'){
    const act=all.filter(isActive).sort((a,b)=>(b.start||'').localeCompare(a.start||'')),past=all.filter(a=>!isActive(a)).sort((a,b)=>(b.end||'').localeCompare(a.end||''));
    if(act.length)h+=`<section class="sect"><h2>${esc(t('a.active'))}</h2><div class="list">${act.map(assignCard).join('')}</div></section>`;
    if(past.length)h+=`<section class="sect"><h2>${esc(t('a.past'))}</h2><div class="list">${past.map(assignCard).join('')}</div></section>`;
    return h;
  }
  const L=all.filter(r=>!S.vf||r.vehicleId===S.vf).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||0)-(a.updatedAt||0));
  if(!L.length)return h+`<p class="muted">${esc(t('noResult'))}</p>`;
  if(sub!=='movements')h+=totalBar(L.reduce((s,r)=>s+num(r.cost),0));
  const cardFn={movements:moveCard,maintenance:maintCard,fuel:fuelCard,incidents:incCard}[sub];
  return h+`<div class="list">${L.slice(0,300).map(cardFn).join('')}</div>`;
}
function moveCard(m){
  return card('movements',m.id,`<div class="ctop">${plateChip(m.vehicleId)}${pill(m.type==='in'?'ok':'info',t(m.type==='in'?'m.in':'m.out'))}</div>
    <div class="ctop"><span class="ctitle">${esc(t('r.'+(m.reason||'other')))}</span><span class="mono muted">${esc(fmt(m.date))}</span></div>
    ${(m.km||m.note)?`<div class="cmeta">${m.km?esc(nfmt(num(m.km)))+' km':''}${m.km&&m.note?' · ':''}${esc(m.note||'')}</div>`:''}`);
}
function maintCard(m){
  let nx='';
  if(m.nextDate)nx+=pill(status(m.nextDate),t('mt.nextDate')+' '+fmtShort(m.nextDate));
  if(num(m.nextKm)>0)nx+=' '+pill('neutral',t('mt.nextKm').replace(' (km)','')+' '+nfmt(num(m.nextKm))+' km');
  return card('maintenance',m.id,`<div class="ctop">${plateChip(m.vehicleId)}<span class="mono strong">${num(m.cost)?esc(money(m.cost)):''}</span></div>
    <div class="ctop"><span class="ctitle">${esc(mtLabel(m))}</span><span class="mono muted">${esc(fmt(m.date))}</span></div>
    <div class="cmeta">${[m.km?nfmt(num(m.km))+' km':'',m.garage||'',m.note||''].filter(Boolean).map(esc).join(' · ')}</div>${nx?`<div class="chips">${nx}</div>`:''}`);
}
function fuelCard(f){
  const ppl=num(f.liters)>0&&num(f.cost)>0?num(f.cost)/num(f.liters):0;
  return card('fuel',f.id,`<div class="ctop">${plateChip(f.vehicleId)}<span class="mono strong">${num(f.cost)?esc(money(f.cost)):''}</span></div>
    <div class="ctop"><span class="ctitle">${esc(nfmt(num(f.liters)))} L</span><span class="mono muted">${esc(fmt(f.date))}</span></div>
    <div class="cmeta">${[f.km?nfmt(num(f.km))+' km':'',ppl?nfmt(ppl)+' '+(S.settings.currency||'')+'/L':'',f.driverId?nameOf(f.driverId):''].filter(Boolean).map(esc).join(' · ')}</div>`);
}
function incCard(i){
  const open=i.status!=='closed';

function complianceIssues(){
  const out=[],push=(sev,text,col,id)=>out.push({sev,text,col,id});
  const act=S.data.assignments.filter(isActive),driven=new Set(act.map(a=>a.vehicleId));
  for(const a of act){
    const v=byId('vehicles',a.vehicleId),d=byId('drivers',a.driverId);
    if(v)for(const x of v.docs||[]){const st=status(x.expiry);
      if(st==='expired')push(0,t('ag.i.vDoc',{plate:v.plate,doc:docLabel(x),who:d?d.name:t('unknownD')}),'vehicles',v.id);
      else if(st==='unset')push(2,t('ag.i.unset',{who:v.plate,doc:docLabel(x)}),'vehicles',v.id);}
    if(d)for(const x of d.docs||[]){const st=status(x.expiry);
      if(st==='expired')push(0,t('ag.i.dDoc',{name:d.name,doc:docLabel(x),plate:v?v.plate:t('unknownV')}),'drivers',d.id);
      else if(st==='unset')push(2,t('ag.i.unset',{who:d.name,doc:docLabel(x)}),'drivers',d.id);}
  }
  for(const v of S.data.vehicles){
    if(v.status==='out'||driven.has(v.id))continue;
    for(const x of v.docs||[])if(status(x.expiry)==='expired')push(1,t('ag.i.idle',{plate:v.plate,doc:docLabel(x)}),'vehicles',v.id);
    push(2,t('ag.i.noDriver',{plate:v.plate}),'vehicles',v.id);
  }
  for(const x of maintAlerts())if(x.st==='expired')push(1,t('ag.i.maint',{plate:x.v.plate,type:mtLabel(x.m)}),'vehicles',x.v.id);
  for(const i of S.data.incidents)if(i.status!=='closed')push(1,t('ag.i.inc',{plate:plateOf(i.vehicleId),type:T['ity.'+i.type]?t('ity.'+i.type):(i.type||'')}),'incidents',i.id);
  return out.sort((a,b)=>a.sev-b.sev);
}

function reminders(){
  const out=[];
  for(const d of S.data.drivers){
    const lines=[],a=activeFor('driverId',d.id),v=a?byId('vehicles',a.vehicleId):null;
    const add=(x,suffix)=>{const n=daysLeft(x.expiry);if(n!==null&&n<=ALERT())lines.push({n,txt:'- '+docLabel(x)+suffix+' : '+daysText(x.expiry)+' ('+fmt(x.expiry)+')'});};
    (d.docs||[]).forEach(x=>add(x,''));

    out.push({d,msg:t('ag.msgHello',{name:d.name,co:S.settings.company})+'\n'+lines.map(l=>l.txt).join('\n')+'\n'+t('ag.msgBye')});

function syncForm(){
  const f=document.getElementById('dlgform'),o=S.edit.obj;
  for(const el of f.elements){
    if(!el.name||el.closest('.docrow')||el.type==='button'||el.type==='submit')continue;
    if(el.type==='radio'){if(el.checked)o[el.name]=el.value;}else o[el.name]=el.value;
  }
  f.querySelectorAll('.docrow').forEach(r=>{
    const i=+r.dataset.i,d=o.docs[i];if(!d)return;
    d.expiry=r.querySelector('[name=exp]').value;
    const rf=r.querySelector('[name=ref]');if(rf)d.ref=rf.value;
    const l=r.querySelector('[name=label]');if(l)d.label=l.value;
  });
}
const overlap=(a,b)=>(a.start||'')<(b.end||'9999-12-31')&&(b.start||'')<(a.end||'9999-12-31');
function validate(col,o){
  if(col==='vehicles'){
    if(!o.plate.trim())return t('err.required');
    const k=norm(o.plate);
    if(S.data.vehicles.some(v=>v.id!==o.id&&norm(v.plate)===k))return t('err.dup');
  }
  if(col==='drivers'&&!o.name.trim())return t('err.required');
  if(col==='assignments'){
    if(!o.driverId||!o.vehicleId)return t('a.errPick');
    if(!o.start)return t('err.required');
    if(o.end&&o.end<o.start)return t('a.errDates');
    const cv=S.data.assignments.find(a=>a.id!==o.id&&a.vehicleId===o.vehicleId&&overlap(o,a));
    if(cv)return t('a.errVehicle',{who:nameOf(cv.driverId)});
    const cd=S.data.assignments.find(a=>a.id!==o.id&&a.driverId===o.driverId&&overlap(o,a));
    if(cd)return t('a.errDriver',{who:nameOf(o.driverId),plate:plateOf(cd.vehicleId)});
  }
  if(col==='movements'&&(!o.vehicleId||!o.date))return t('m.errPick');
  if(col==='maintenance'&&(!o.vehicleId||!o.date))return t('mt.errPick');
  if(col==='fuel'&&(!o.vehicleId||!o.date))return t('fu.errPick');
  if(col==='incidents'&&(!o.vehicleId||!o.date))return t('in.errPick');
  for(const k of ['km','cost','liters','nextKm'])if(o[k]!==undefined&&o[k]!==''&&(!isFinite(parseFloat(String(o[k]).replace(',','.')))||num(o[k])<0))return t('err.num');
  return '';
}
function tidy(col,o){
  const c=clone(o);
  for(const k in c)if(typeof c[k]==='string')c[k]=c[k].trim();
  if(col==='vehicles')c.plate=c.plate.toUpperCase().replace(/\s+/g,' ');
  if(c.docs)c.docs=c.docs.filter(d=>d.type!=='custom'||d.label||d.expiry);
  for(const k of ['km','cost','liters','nextKm'])if(k in c&&c[k]!=='')c[k]=num(c[k]);
  delete c.demo;
  return c;
}
async function hashPin(p){
  const s='tecars|'+p;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return 'h:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'x:'+(h>>>0).toString(16);
}
async function saveEdit(){
  syncForm();
  const {col,obj,isNew}=S.edit;
  if(col==='_pin'){
    if(!/^\d{4,8}$/.test(obj.pin1||''))return showErr(t('pin.bad'));
    if(obj.pin1!==obj.pin2)return showErr(t('pin.mismatch'));
    S.settings.pin=await hashPin(obj.pin1);save();closeDlg();toast(t('pin.set'));render();return;
  }
  const err=validate(col,obj);
  if(err){showErr(err);return;}
  hideErr();
  const btn=document.getElementById('dlg-save');if(btn)btn.disabled=true;
  try{
    const c=tidy(col,obj);
    put(col,c,true);
    if(col==='movements'&&isNew){const v=byId('vehicles',c.vehicleId);if(v)put('vehicles',{...clone(v),status:c.type==='in'?'in':'out'},true);}
    if(['movements','maintenance','fuel'].includes(col)&&c.km!==''){const v=byId('vehicles',c.vehicleId);if(v&&num(c.km)>num(v.km))put('vehicles',{...clone(v),km:num(c.km)},true);}
    closeDlg();toast(t('saved'));render();
  }catch(e){console.error(e);showErr(t('err.save'));if(btn)btn.disabled=false;}
}

let tt;
function toast(m,actLabel,fn){
  const e=document.getElementById('toast');
  e.innerHTML='';e.append(document.createTextNode(m));
  e.classList.toggle('act',!!actLabel);
  if(actLabel){const b=document.createElement('button');b.type='button';b.textContent=actLabel;b.onclick=()=>{e.classList.remove('show');fn();};e.append(b);}
  e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),actLabel?6000:2600);
}

/* ===================== ÉVÉNEMENTS ===================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(!b)return;
  const a=b.dataset.action;
  if(a==='lang'){S.lang=b.dataset.v;try{localStorage.setItem(LSL,S.lang);}catch(x){}render();}
  else if(a==='filter'){S.filter=b.dataset.v;render();}
  else if(a==='vstat'){S.vstat=b.dataset.v;render();}
  else if(a==='open')openEditor(b.dataset.col,b.dataset.id);
  else if(a==='add')openEditor(b.dataset.col,null,S.vf&&['maintenance','fuel','incidents','movements'].includes(b.dataset.col)&&S.tab==='activity'?{vehicleId:S.vf}:null);
  else if(a==='addfor'){const col=b.dataset.col,vid=b.dataset.vid;closeDlg();openEditor(col,null,{vehicleId:vid});}
  else if(a==='closedlg')closeDlg();
  else if(a==='endtoday')endToday(b.dataset.id);
  else if(a==='rmdemo')removeDemo();
  else if(a==='demo'){loadDemo();}
  else if(a==='adddoc'){
    syncForm();
    const k=document.getElementById('newdoc').value,o=S.edit.obj;
    o.docs=o.docs||[];o.docs.push({id:uid('d'),type:k,expiry:'',ref:'',...(k==='custom'?{label:''}:{})});
    paintDlg();
    const i=o.docs.length-1,el=document.getElementById(k==='custom'?'dl-'+i:'de-'+i);if(el)el.focus();
  }
  else if(a==='rmdoc'){syncForm();S.edit.obj.docs.splice(+b.dataset.i,1);paintDlg();}
  else if(a==='copy'){const el=document.getElementById(b.dataset.src);copyText(el?el.textContent:'',el);}
  else if(a==='export'||a==='exportnow')exportFile();
  else if(a==='sharebk')shareBackup();
  else if(a==='copyjson'){copyText(backupJSON(),null);markExported();}
  else if(a==='readpaste'){const ta=document.getElementById('bk-paste'),p=parseBackup(ta?ta.value:S.pasted);if(p){S.pending=p;}else{S.pending=null;toast(t('bk.bad'));}render();}
  else if(a==='doimport')applyImport(b.dataset.v);
  else if(a==='cancelimport'){S.pending=null;render();}
  else if(a==='restore')restoreSnap(b.dataset.key);
  else if(a==='csv')download('tecars-'+b.dataset.k+'-'+iso(today())+'.csv',toCSV(csvRows(b.dataset.k)),'text/csv;charset=utf-8');
  else if(a==='print')window.print();
  else if(a==='pin')openEditor('_pin',null);
  else if(a==='pinoff'){S.settings.pin='';save();render();toast(t('pin.removed'));}
  else if(a==='wipe'){
    if(b.classList.contains('armed'))wipeAll();
    else{b.classList.add('armed');b.textContent=t('st.wipeConfirm');}
  }
  else if(a==='install'){const ev=S.installEvt;if(ev){ev.prompt();ev.userChoice.finally(()=>{S.installEvt=null;render();});}}
  else if(a==='hideinst'){S.instHidden=true;render();}
  else if(a==='reload')location.reload();
  else if(a==='delete'){
    if(b.classList.contains('armed'))removeCurrent();
    else{
      const {col,obj}=S.edit,n=linkedOf(col,obj.id).rm.length;
      b.classList.add('armed');b.textContent=n?t('cascadeBtn',{n}):t('confirmDel');
    }
  }
});
async function restoreSnap(key){
  const s=(S.snaps||[]).find(x=>x.key===key);if(!s)return;
  const d=new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(s.at));
  if(!confirm(t('bk.restoreConfirm',{d})))return;
  try{
    const pin=S.settings.pin;
    await snapshot('pre');
    applyPayload(JSON.parse(s.json));S.settings.pin=pin;
    await flush();S.snaps=null;render();toast(t('bk.restored'));
  }catch(e){toast(t('err.save'));}
}
async function wipeAll(){
  await snapshot('pre');
  S.data=Object.fromEntries(COLS.map(c=>[c,[]]));
  await flush();S.snaps=null;render();toast(t('st.wiped'));
}

function readHash(){
  const parts=(location.hash||'').replace('#','').split('/'),tab=TABS.includes(parts[0])?parts[0]:'home';
  const changed=tab!==S.tab||(tab==='more'&&(parts[1]||null)!==S.page);
  S.tab=tab;
  if(tab==='activity'&&SUBS.includes(parts[1]))S.sub=parts[1];
  S.page=tab==='more'&&PAGES.includes(parts[1])?parts[1]:null;
  if(S.page!=='backup'){S.snaps=null;}
  if(changed)window.scrollTo(0,0);
  render();
}
window.addEventListener('hashchange',readHash);

  else if(S.settings.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&!S.lock){S.lock=true;closeDlg();render();}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(S.loaded)render();});

async function init(){
  render();
  try{await loadState();}catch(e){console.error(e);}
  S.loaded=true;
  if(S.settings.pin)S.lock=true;
  readHash();
  flush();askPersist();autoSnapshot();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!S.upd){S.upd=true;if(!S.edit)render();}});
  }
}

init();
